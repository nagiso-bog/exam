<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>apple MacBook</title>
    <link rel="stylesheet" href="main.css">
</head>

<body>
    <header>
        <h1>exam CRUD</h1>
        <span class="user_name"></span>
    </header>
    <main>
        <section>
            <div class="container">
                <form action="" class="form">
                    <div class="form-group">
                        <label class="product_name">Product Name:</label>
                        <input type="text" placeholder="your product name" value="Apple MacBook Pro 16"
                            class="productname" required>
                    </div>
                    <label class="productdescription">Product details:</label>
                    <div class="form-group">
                        <label class="product_price">Product Price:</label>
                        <input type="text" placeholder="your product price" value="1849.49" class="productprice"
                            required>
                    </div>
                    <div class="form-group">
                        <label class="product_year">Product year:</label>
                        <input type="text" placeholder="your product year" value="2019" class="productyear" required>
                    </div>
                    <div class="form-group">
                        <label class="product_cpu">CPU model:</label>
                        <input type="text" placeholder="your CPU model" value="Intel Core i9" class="cpumodel" required>
                    </div>
                    <div class="form-group">
                        <label class="product_disk">hard disk:</label>
                        <input type="text" placeholder="your hard disk" value="1 TB" class="harddisk" required>
                    </div>

                    <button class="add_btn" type="submit">Add</button>

                    <ul class="list">

                    </ul>

                </form>
            </div>
        </section>
    </main>
    <script src="index.js"></script>
</body>

</html>
