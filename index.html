<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section>
            <div class="header">
                <h1>exam CRUD</h1>
                <a href="login.html" class="login-link">Login</a>
            </div>
            <div class="container">
                <h1>Register</h1>
                <form class="form">
                    <label class="username">Username:</label>
                    <input type="text" placeholder="Write your username" class="reg_username" required>

                    <label class="email">Email:</label>
                    <input type="email" placeholder="Write your email" class="reg_email" required>

                    <label class="password">Password:</label>
                    <input type="password" placeholder="Write your password" class="reg_password" required>

                    <button class="reg_btn" type="submit">Register</button>
                </form>
            </div>
        </section>
    </main>

    <script src="register.js"></script>
</body>

</html>
